services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegramassistant
      POSTGRES_USER: telegramassistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegramassistant -d telegramassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  telegramassistant:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=telegramassistant;Username=telegramassistant;Password=${POSTGRES_PASSWORD:-change-me-local-only}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
